name: Update weather data (tenki.jp)

on:
  schedule:
    # 毎時05分（UTC）に実行。tenki.jpの予報更新（5時・11時・17時ごろ）に追随する。
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-weather
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch tenki.jp and build weather.json
        run: python scripts/fetch_tenki.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- weather.json; then
            echo "weather.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git commit -m "Update weather data (tenki.jp)"
          git push
